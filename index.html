<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#266431">

    <title>ABA Terminal</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://unpkg.com/html5-qrcode"></script>

</head>

<body>

<div id="app">

    <header>

        <h1>ABA Terminal</h1>

        <p>Terminale portatile</p>

    </header>


    <main>


        <!-- ========================= -->
        <!-- SCANNER CODICE PRODOTTO -->
        <!-- ========================= -->

        <button
            id="btnScanner"
            class="primary"
            type="button">

            📷 SCANSIONA CODICE PRODOTTO

        </button>


        <!-- AREA FOTOCAMERA -->

        <div
            id="reader"
            class="reader">
        </div>


        <!-- ========================= -->
        <!-- DATI ARTICOLO -->
        <!-- ========================= -->

        <section class="form">


            <!-- CODICE PRODOTTO -->

            <label for="barcode">

                Barcode / Codice prodotto

            </label>

            <input
                type="text"
                id="barcode"
                placeholder="Barcode o codice prodotto"
                autocomplete="off">


            <!-- MODELLO -->

            <label for="modello">

                Modello

            </label>

            <input
                type="text"
                id="modello"
                placeholder="Modello"
                autocomplete="off">


            <!-- MATRICOLA -->

            <label for="matricola">

                Matricola

            </label>

            <input
                type="text"
                id="matricola"
                placeholder="Matricola"
                autocomplete="off">


            <!-- ========================= -->
            <!-- LETTURA MATRICOLA -->
            <!-- ========================= -->

            <button
                id="btnMatricola"
                class="primary"
                type="button">

                📷 LEGGI MATRICOLA

            </button>


            <!-- ========================= -->
            <!-- QUANTITÀ -->
            <!-- ========================= -->

            <label>

                Quantità

            </label>


            <div class="quantity">


                <button
                    id="btnMeno"
                    type="button">

                    −

                </button>


                <input
                    type="number"
                    id="quantita"
                    value="1"
                    min="1"
                    readonly>


                <button
                    id="btnPiu"
                    type="button">

                    +

                </button>


            </div>


            <!-- AGGIUNGI -->

            <button
                id="btnAggiungi"
                class="success"
                type="button">

                ➕ AGGIUNGI

            </button>


        </section>


        <!-- ========================= -->
        <!-- ARTICOLI ACQUISITI -->
        <!-- ========================= -->

        <section>

            <h2>

                Articoli acquisiti

            </h2>

            <div id="listaArticoli"></div>

        </section>


        <!-- ========================= -->
        <!-- ESPORTAZIONE -->
        <!-- ========================= -->

        <button
            id="btnEsporta"
            class="export"
            type="button">

            📄 ESPORTA CSV

        </button>


    </main>


    <footer>

        ABA Terminal · Versione 1.1

    </footer>


</div>


<script src="js/app.js"></script>

<script src="js/scanner.js"></script>

<script src="js/export.js"></script>


</body>

</html>

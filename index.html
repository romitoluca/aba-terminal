<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ABA Terminal</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://unpkg.com/html5-qrcode"></script>

</head>

<body>

<div id="app">

    <header>

        <h1>ABA Terminal</h1>

        <p>Terminale Inventario</p>

    </header>

    <main>

        <button id="btnScanner">
            📷 APRI SCANNER
        </button>

        <div id="reader"></div>

        <label>Barcode articolo</label>

        <input
            id="barcode"
            type="text"
            readonly>

        <button id="btnScannerMatricola">
            📷 LEGGI MATRICOLA
        </button>

        <label>Matricola</label>

        <input
            id="matricola"
            type="text"
            placeholder="oppure inseriscila manualmente">

        <label>Quantità</label>

        <div class="quantita">

            <button id="btnMeno">−</button>

            <input
                id="quantita"
                value="1"
                readonly>

            <button id="btnPiu">+</button>

        </div>

        <button id="btnAggiungi">
            ➕ AGGIUNGI
        </button>

        <hr>

        <h2>Articoli acquisiti</h2>

        <div id="listaArticoli"></div>

        <button id="btnEsporta">
            📄 ESPORTA CSV
        </button>

    </main>

</div>

<script src="js/app.js"></script>
<script src="js/scanner.js"></script>
<script src="js/export.js"></script>

</body>

</html>
